name: Feature
description: Propose a change. Discuss it here before opening a pull request.
title: "[Feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas are welcome. Search existing issues first, then propose the change here before opening a pull request. See [CONTRIBUTING.md](../../blob/HEAD/CONTRIBUTING.md).
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I have searched existing issues
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to add or change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this is useful
      description: Who would this help, and what would get easier?
    validations:
      required: true
